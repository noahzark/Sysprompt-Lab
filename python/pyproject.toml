[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sysprompt-gepa"
version = "0.1.0"
description = "Sysprompt Lab sidecar that wraps official gepa.optimize for R2."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
dependencies = [
  "gepa>=0.1.4,<0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sysprompt-gepa = "sysprompt_gepa.sidecar:main"

[tool.setuptools.packages.find]
include = ["sysprompt_gepa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
